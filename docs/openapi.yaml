      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
          example: "auc_create_987654"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, category_id, condition, starting_bid, scheduled_start_at, pickup_area]
              properties:
                title:
                  type: string
                  example: "Sony PlayStation 5 Slim Edition + 2 Controllers"
                description:
                  type: string
                  example: "Brand new in box, sealed with warranty."
                category_id:
                  type: integer
                  example: 1
                condition:
                  type: string
                  enum: [brand_new, like_new, gently_used, for_parts]
                  example: "brand_new"
                starting_bid:
                  type: integer
                  description: Minimum starting bid in kobo
                  example: 35000000
                reserve_price:
                  type: integer
                  description: Confidential reserve price in kobo (masked from buyers)
                  example: 45000000
                pickup_area:
                  type: string
                  example: "Lekki Phase 1, Lagos"
                scheduled_start_at:
                  type: string
                  format: date-time
                  example: "2026-11-08T16:00:00Z"
                live_duration_seconds:
                  type: integer
                  default: 180
                  example: 180
      responses:
        201:
          description: Auction created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuctionDetailResponse'
              example:
                status: true
                message: "Auction listing scheduled successfully."
                data:
                  id: 102
                  title: "Sony PlayStation 5 Slim Edition + 2 Controllers"
                  condition: "brand_new"
                  status: "scheduled"
                  starting_bid_kobo: 35000000
                  reserve_price_kobo: 45000000
                  pickup_area: "Lekki Phase 1, Lagos"
                  scheduled_start_at: "2026-11-08T16:00:00Z"

  /auctions/{id}:
    get:

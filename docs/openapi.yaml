  # ==========================================
  # BIDDING ENGINE
  # ==========================================
  /auctions/{id}/bids:
    get:
      summary: View live auction bid leaderboard
      description: Retrieves ranked list of highest active bids with tie-breaking and bidder masking.
      tags: [Bidding Engine]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          example: 102
      responses:
        200:
          description: Ranked active leaderboard
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BidLeaderboardResponse'
              example:
                status: true
                message: "Leaderboard retrieved successfully."
                data:
                  auction_id: 102
                  leaderboard:
                    - rank: 1
                      bid_id: 543
                      amount_kobo: 48000000
                      bidder_masked: "Bidder ***4567"
                      placed_at: "2026-11-06T18:42:15Z"
                    - rank: 2
                      bid_id: 540
                      amount_kobo: 46000000
                      bidder_masked: "Bidder ***9012"
                      placed_at: "2026-11-06T18:41:50Z"
    post:
      summary: Place or raise bid with atomic Redis mutex locking
      description: >-
        Verifies wallet balance, places atomic Redis lock, executes incremental lock ledger transfer,
        extends anti-sniping timer if placed in final 30s, and broadcasts update via Laravel Reverb.
      security:
        - BearerAuth: []
      tags: [Bidding Engine]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          example: 102
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount_kobo]
              properties:
                amount_kobo:
                  type: integer
                  description: Bid amount in kobo (must satisfy minimum 5% increment)
                  example: 50000000
                client_request_id:
                  type: string
                  example: "bid_req_uuid_12345"
      responses:
        201:
          description: Bid placed and broadcast
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaceBidResponse'
              example:
                status: true
                message: "Bid placed successfully!"
                data:
                  bid:
                    id: 545
                    auction_id: 102
                    amount_kobo: 50000000
                    status: "active"
                    created_at: "2026-11-06T18:43:00Z"
                  leaderboard:
                    - rank: 1
                      bid_id: 545
                      amount_kobo: 50000000
                      bidder_masked: "Bidder ***4567"
        403:
          description: Bid prohibited (e.g. self-bidding or missing terms consent)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
              example:
                status: false
                message: "Sellers cannot place bids on their own auction."
                error: "SELF_BIDDING_PROHIBITED"
                error_code: "SELF_BIDDING_PROHIBITED"
        422:
          description: Bid below minimum increment or insufficient wallet balance
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
              example:
                status: false
                message: "Your available wallet balance is insufficient to place this bid."
                error: "INSUFFICIENT_FUNDS"
                error_code: "INSUFFICIENT_FUNDS"


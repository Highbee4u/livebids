            schema:
              type: object
              required: [code]
              properties:
                code:
                  type: string
                  example: "482910"
      responses:
        200:
          description: Escrow released and order completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderCompletedResponse'
              example:
                status: true
                message: "Handover confirmed! ₦43,200.00 credited to your available balance."
                data:
                  order_id: 301
                  status: "completed"
                  seller_payout_kobo: 43200000
                  commission_kobo: 4800000
        422:
          description: Invalid handover code
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
              example:
                status: false
                message: "The handover verification code provided is incorrect. 4 attempts remaining."
                error: "INVALID_HANDOVER_CODE"
                error_code: "INVALID_HANDOVER_CODE"


openapi: 3.0.3
info:
  title: LiveBids API
  description: >-
    High-concurrency live video auction marketplace API platform built on Laravel 13
    with double-entry ledger settlement, welfare-verification identity checks,
    real-time WebSockets bidding via Laravel Reverb, and standardized ApiResponder envelopes.
  version: 1.0.0
servers:
  - url: http://localhost:8000/api/v1
    description: Local Development Server
  - url: https://api.livebids.ng/api/v1
    description: Production API Server

tags:
  - name: Onboarding
    description: Phone verification, staging intake, address, and profile completion
  - name: Locations
    description: Nigerian geographic data (Countries, States, LGAs/Cities)
  - name: Authentication
    description: Direct SMS OTP authentication, session rotation, and logout
  - name: User Profile
    description: Authenticated user profile management and public user metrics
  - name: Identity & KYC
    description: NIN identity verification and seller authorization
  - name: Discovery
    description: Category feeds, live now carousel, upcoming auctions, and reminders
  - name: Auctions
    description: Live stream auction listing, scheduling, winner selection, and cancellation
  - name: Live Streaming
    description: WebRTC / LiveKit publisher and subscriber room coordination
  - name: Bidding Engine
    description: High-concurrency live bid placement, lock ledger hold, and leaderboards
  - name: Orders & Escrow
    description: Post-auction escrow protection, delivery arrangements, and OTP/handover code release
  - name: Wallet & Ledger
    description: Double-entry account balance inspection and audit statement history
  - name: Payments
    description: Paystack card/virtual account top-ups, bank verification, withdrawals, and webhooks
  - name: Terms & Conditions
    description: Progressive consent, terms versioning, and compliance audit trail
  - name: Admin
    description: Back-office KYC review, disputes resolution, maker-checker adjustments, moderation, and policy enforcement

paths:
  # ==========================================
  # ONBOARDING (STAGING TABLE INTAKE)
  # ==========================================
  /auth/register:
    post:
      summary: Initiate user registration (Staging Table intake)
      description: >-
        Validates phone uniqueness. If already onboarded, returns 409 conflict.
        If phone is new or onboarding is incomplete, creates an OnboardingRequest in staging
        and dispatches a 6-digit SMS OTP via welfare-notifications.
      tags: [Onboarding]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone]
              properties:
                phone:
                  type: string
                  example: "+2348012345678"
                device_id:
                  type: string
                  example: "d9e8c7b6-a5f4-4e3d-2c1b-0a9b8c7d6e5f"
                platform:
                  type: string
                  enum: [android, ios, web]
                  default: android
                  example: "android"
                fcm_token:
                  type: string
                  example: "fcm_token_sample_abc123"
      responses:
        200:
          description: Onboarding intake created; SMS OTP dispatched
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OnboardingInitiatedResponse'
              example:
                status: true
                message: "Onboarding initiated. Verification OTP sent via SMS."
                data:
                  identifier: "738c1b03-d8a9-4adc-90a8-243a830ac938"
                  status: "PENDING_OTP"
                  expires_in_seconds: 600
        409:
          description: Phone already attached to an active, onboarded account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
              example:
                status: false
                message: "This phone number is already registered and onboarded. Please log in instead."
                error: "PHONE_ALREADY_ATTACHED"
                error_code: "PHONE_ALREADY_ATTACHED"
        422:
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
              example:
                status: false
                message: "The phone field is required."
                error: "VALIDATION_ERROR"
                error_code: "VALIDATION_ERROR"
                errors:
                  phone: ["The phone field is required."]

  /auth/register/verify-otp:
    post:
      summary: Verify onboarding phone OTP
      description: >-
        Verifies 6-digit SMS code against staging OnboardingRequest identifier.
        Marks phone verified in staging without creating a core user record yet.
      tags: [Onboarding]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [identifier, code]
              properties:
                identifier:
                  type: string
                  format: uuid
                  example: "738c1b03-d8a9-4adc-90a8-243a830ac938"
                code:
                  type: string
                  example: "123456"
      responses:
        200:
          description: Phone OTP verified; advance to profile setup
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OnboardingOtpVerifiedResponse'
              example:
                status: true
                message: "Phone number verified successfully."
                data:
                  identifier: "738c1b03-d8a9-4adc-90a8-243a830ac938"
                  status: "PENDING_PROFILE"
        422:
          description: Invalid or expired OTP code
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
              example:
                status: false
                message: "The verification code provided is invalid or has expired."
                error: "OTP_INVALID"
                error_code: "OTP_INVALID"

  /auth/onboarding/otp/verify:
    post:
      summary: Verify onboarding phone OTP (Alias route)
      description: Alternate endpoint route mapping to OnboardingController@verifyOtp for mobile app routing.
      tags: [Onboarding]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [identifier, code]
              properties:
                identifier:
                  type: string
                  format: uuid
                  example: "738c1b03-d8a9-4adc-90a8-243a830ac938"
                code:
                  type: string
                  example: "123456"
      responses:
        200:
          description: Phone OTP verified
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OnboardingOtpVerifiedResponse'
              example:
                status: true
                message: "Phone number verified successfully."
                data:
                  identifier: "738c1b03-d8a9-4adc-90a8-243a830ac938"
                  status: "PENDING_PROFILE"
        422:
          description: Invalid or expired OTP code
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
              example:
                status: false
                message: "The verification code provided is invalid or has expired."
                error: "OTP_INVALID"
                error_code: "OTP_INVALID"

  /auth/profile/setup:
    post:
      summary: Complete user profile, address, and atomic account conversion
      description: >-
        Finalizes registration. Enforces 18+ age restriction, validates LGA belongs to selected state,
        atomically creates core User record, assigns public UUID identifier, saves UserAddress,
        initializes zero-balance ledger wallet, and issues Sanctum bearer token.
      tags: [Onboarding]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [identifier, first_name, last_name, date_of_birth, country_id, state_id, lga_id, street_address]
              properties:
                identifier:
                  type: string
                  format: uuid
                  example: "738c1b03-d8a9-4adc-90a8-243a830ac938"
                first_name:
                  type: string
                  example: "Chidi"
                last_name:
                  type: string
                  example: "Okonkwo"
                date_of_birth:
                  type: string
                  format: date
                  description: User date of birth (must be 18+ years old)
                  example: "1998-05-15"
                email:
                  type: string
                  format: email
                  nullable: true
                  example: "chidi.okonkwo@example.com"
                country_id:
                  type: integer
                  example: 1
                state_id:
                  type: integer
                  example: 25
                lga_id:
                  type: integer
                  example: 560
                city:
                  type: string
                  example: "Ikeja"
                street_address:
                  type: string
                  example: "10 Oba Akran Avenue"
                postal_code:
                  type: string
                  nullable: true
                  example: "100001"
      responses:
        201:
          description: Profile completed and core account provisioned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileSetupResponse'
              example:
                status: true
                message: "Profile setup completed successfully. Welcome to LiveBids!"
                data:
                  user:
                    id: "8f6b158b-9d41-477d-9dc6-b4d081fdfd8e"
                    identifier: "8f6b158b-9d41-477d-9dc6-b4d081fdfd8e"
                    phone: "+2348012345678"
                    name: "Chidi Okonkwo"
                    first_name: "Chidi"
                    last_name: "Okonkwo"
                    email: "chidi.okonkwo@example.com"
                    date_of_birth: "1998-05-15"
                    is_onboarded: true
                    is_kyc_verified: false
                    rating: 0.0
                    strikes_count: 0
                  token: "1|laravel_sanctum_token_xyz9876543210"
                  status: "ONBOARDING_COMPLETE"
        422:
          description: Validation error (underage or invalid LGA/state mismatch)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
              example:
                status: false
                message: "You must be at least 18 years of age to register on LiveBids."
                error: "VALIDATION_ERROR"
                error_code: "VALIDATION_ERROR"
                errors:
                  date_of_birth: ["You must be at least 18 years of age to register on LiveBids."]

  # ==========================================
  # LOCATIONS
  # ==========================================
  /locations/countries:
    get:
      summary: List supported countries
      tags: [Locations]
      responses:
        200:
          description: List of supported countries with currency and ISO codes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CountriesResponse'
              example:
                status: true
                message: "Countries retrieved successfully."
                data:
                  - id: 1
                    name: "Nigeria"
                    iso2: "NG"
                    iso3: "NGA"
                    phone_code: "+234"
                    currency: "NGN"

  /locations/states:
    get:
      summary: List states for a country
      tags: [Locations]
      parameters:
        - name: country_id
          in: query
          required: false
          schema:
            type: integer
            default: 1
          example: 1
      responses:
        200:
          description: List of administrative states
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatesResponse'
              example:
                status: true
                message: "States retrieved successfully."
                data:
                  - id: 25
                    country_id: 1
                    name: "Lagos"
                    code: "LA"
                  - id: 15
                    country_id: 1
                    name: "Abuja Federal Capital Territory"
                    code: "FC"

  /locations/states/{stateId}/cities:
    get:
      summary: List LGAs / cities belonging to a state
      tags: [Locations]
      parameters:
        - name: stateId
          in: path
          required: true
          schema:
            type: integer
          example: 25
      responses:
        200:
          description: List of LGAs and cities in state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CitiesResponse'
              example:
                status: true
                message: "Cities retrieved successfully."
                data:
                  - id: 560
                    state_id: 25
                    name: "Ikeja"
                  - id: 561
                    state_id: 25
                    name: "Lagos Island"

  # ==========================================
  # AUTHENTICATION
  # ==========================================
  /auth/otp/request:
    post:
      summary: Request phone OTP for login or sensitive operations
      description: Dispatches a 6-digit SMS OTP via welfare-notifications. Rate limited to 5 attempts per phone per hour.
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone]
              properties:
                phone:
                  type: string
                  example: "+2348012345678"
                purpose:
                  type: string
                  enum: [login, withdrawal_confirmation, admin_sensitive_action]
                  default: login
                  example: "login"
                device_id:
                  type: string
                  example: "d9e8c7b6-a5f4-4e3d-2c1b-0a9b8c7d6e5f"
      responses:
        200:
          description: OTP dispatched successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtpRequestedResponse'
              example:
                status: true
                message: "Verification code sent successfully via SMS."
                data:
                  expires_at: "2026-11-06T19:10:00Z"
        429:
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
              example:
                status: false
                message: "Too Many Requests. Please wait before requesting another OTP."
                error: "TOO_MANY_REQUESTS"
                error_code: "TOO_MANY_REQUESTS"

  /auth/otp/verify:
    post:
      summary: Verify phone OTP and authenticate session
      description: Verifies 6-digit code, verifies device binding, and issues Sanctum personal access token.
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, code]
              properties:
                phone:
                  type: string
                  example: "+2348012345678"
                code:
                  type: string
                  example: "123456"
                purpose:
                  type: string
                  enum: [login, withdrawal_confirmation, admin_sensitive_action]
                  default: login
                device_id:
                  type: string
                  example: "d9e8c7b6-a5f4-4e3d-2c1b-0a9b8c7d6e5f"
                platform:
                  type: string
                  enum: [android, ios, web]
                  default: android
                fcm_token:
                  type: string
                  example: "fcm_token_sample_abc123"
      responses:
        200:
          description: Authenticated successfully; token issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenResponse'
              example:
                status: true
                message: "Authentication successful."
                data:
                  token: "2|laravel_sanctum_auth_token_sample"
                  token_type: "Bearer"
                  user:
                    id: "8f6b158b-9d41-477d-9dc6-b4d081fdfd8e"
                    identifier: "8f6b158b-9d41-477d-9dc6-b4d081fdfd8e"
                    phone: "+2348012345678"
                    name: "Chidi Okonkwo"
                    is_kyc_verified: false
        422:
          description: Invalid OTP code or expired code
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
              example:
                status: false
                message: "The verification code provided is invalid or has expired."
                error: "OTP_INVALID"
                error_code: "OTP_INVALID"

  /auth/refresh:
    post:
      summary: Refresh authentication session token
      description: Revokes the caller's current personal access token and issues a fresh replacement token.
      security:
        - BearerAuth: []
      tags: [Authentication]
      responses:
        200:
          description: Session token refreshed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenResponse'
              example:
                status: true
                message: "Session token refreshed successfully."
                data:
                  token: "3|new_sanctum_session_token_xyz"
                  token_type: "Bearer"
                  user:
                    id: "8f6b158b-9d41-477d-9dc6-b4d081fdfd8e"
                    identifier: "8f6b158b-9d41-477d-9dc6-b4d081fdfd8e"
                    phone: "+2348012345678"
                    name: "Chidi Okonkwo"

  /auth/logout:
    post:
      summary: Revoke current session token
      security:
        - BearerAuth: []
      tags: [Authentication]
      responses:
        200:
          description: Logged out and token revoked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardMessageResponse'
              example:
                status: true
                message: "Logged out successfully."

  # ==========================================
  # USER PROFILE
  # ==========================================
  /me:
    get:
      summary: Authenticated user profile and trust metrics
      security:
        - BearerAuth: []
      tags: [User Profile]
      responses:
        200:
          description: User profile and account status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileResponse'
              example:
                status: true
                message: "User profile retrieved successfully."
                data:
                  user:
                    id: "8f6b158b-9d41-477d-9dc6-b4d081fdfd8e"
                    identifier: "8f6b158b-9d41-477d-9dc6-b4d081fdfd8e"
                    phone: "+2348012345678"
                    name: "Chidi Okonkwo"
                    first_name: "Chidi"
                    last_name: "Okonkwo"
                    email: "chidi.okonkwo@example.com"
                    is_onboarded: true
                    is_kyc_verified: true
                    pickup_area: "Ikeja"
                    rating: 4.85
                    strikes_count: 0
                    roles: ["buyer", "seller"]
    patch:
      summary: Update profile name and FCM push notification token
      security:
        - BearerAuth: []
      tags: [User Profile]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: "Chidi C. Okonkwo"
                fcm_token:
                  type: string
                  example: "new_fcm_token_xyz"
                pickup_area:
                  type: string
                  example: "Victoria Island, Lagos"
      responses:
        200:
          description: Profile updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileResponse'
              example:
                status: true
                message: "Profile updated successfully."
                data:
                  user:
                    id: "8f6b158b-9d41-477d-9dc6-b4d081fdfd8e"
                    identifier: "8f6b158b-9d41-477d-9dc6-b4d081fdfd8e"
                    name: "Chidi C. Okonkwo"
                    pickup_area: "Victoria Island, Lagos"

  /users/{id}/public:
    get:
      summary: View public profile and trust reputation metrics of any seller or bidder
      tags: [User Profile]
      parameters:
        - name: id
          in: path
          required: true
          description: Public UUID identifier or integer ID of the target user
          schema:
            type: string
          example: "8f6b158b-9d41-477d-9dc6-b4d081fdfd8e"
      responses:
        200:
          description: Public profile metrics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicProfileResponse'
              example:
                status: true
                message: "Public profile retrieved successfully."
                data:
                  id: "8f6b158b-9d41-477d-9dc6-b4d081fdfd8e"
                  identifier: "8f6b158b-9d41-477d-9dc6-b4d081fdfd8e"
                  name: "Chidi O."
                  avatar_url: "https://cdn.livebids.ng/avatars/user_8f6b.jpg"
                  rating: 4.85
                  review_count: 24
                  strikes_count: 0
                  pickup_area: "Ikeja"
                  auctions_completed: 18
                  member_since: "2026-02-15T10:00:00Z"
        404:
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
              example:
                status: false
                message: "Resource not found."
                error: "RESOURCE_NOT_FOUND"
                error_code: "RESOURCE_NOT_FOUND"

  # ==========================================
  # IDENTITY & KYC
  # ==========================================
  /kyc/submit:
    post:
      summary: Submit National Identification Number (NIN) for verification
      description: >-
        Validates 11-digit NIN via welfare-verification package. Enforces strict NIN uniqueness across accounts.
        Persists base64 photo to private cloud storage, extracts legal name, and promotes user to 'seller' role upon success.
      security:
        - BearerAuth: []
      tags: [Identity & KYC]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nin]
              properties:
                nin:
                  type: string
                  minLength: 11
                  maxLength: 11
                  example: "12345678901"
      responses:
        200:
          description: KYC verified successfully; seller role granted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KycSubmitResponse'
              example:
                status: true
                message: "KYC verified successfully. You are now authorized to list and host auctions."
                data:
                  kyc_status: "verified"
                  verified_name: "CHIDI CHUKWUDI OKONKWO"
                  nin_masked: "123*****901"
                  verified_at: "2026-11-06T18:00:00Z"
        409:
          description: Duplicate NIN detected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
              example:
                status: false
                message: "This National Identification Number is already registered to another account."
                error: "DUPLICATE_NIN"
                error_code: "DUPLICATE_NIN"

  /kyc/status:
    get:
      summary: Check identity verification status
      security:
        - BearerAuth: []
      tags: [Identity & KYC]
      responses:
        200:
          description: Current KYC status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KycStatusResponse'
              example:
                status: true
                message: "KYC status retrieved successfully."
                data:
                  is_kyc_verified: true
                  status: "verified"
                  submitted_at: "2026-11-06T18:00:00Z"
                  rejection_reason: null

  # ==========================================
  # DISCOVERY & FEEDS
  # ==========================================
  /categories:
    get:
      summary: List all active auction categories
      tags: [Discovery]
      responses:
        200:
          description: Array of auction categories
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoriesResponse'
              example:
                status: true
                message: "Categories retrieved successfully."
                data:
                  - id: 1
                    name: "Smartphones & Electronics"
                    slug: "smartphones-electronics"
                    icon_url: "https://cdn.livebids.ng/categories/phones.png"
                    auctions_count: 42
                  - id: 2
                    name: "Vehicles & Motors"
                    slug: "vehicles-motors"
                    icon_url: "https://cdn.livebids.ng/categories/cars.png"
                    auctions_count: 15

  /feed/upcoming:
    get:
      summary: Upcoming scheduled auctions swipe feed
      tags: [Discovery]
      parameters:
        - name: category_id
          in: query
          required: false
          schema:
            type: integer
          example: 1
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
      responses:
        200:
          description: Paginated upcoming auctions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpcomingAuctionsResponse'
              example:
                status: true
                message: "Upcoming auctions retrieved successfully."
                data:
                  - id: 101
                    title: "iPhone 15 Pro Max 256GB Natural Titanium"
                    condition: "like_new"
                    starting_bid_kobo: 60000000
                    scheduled_start_at: "2026-11-07T14:00:00Z"
                    teaser_video_url: "https://cdn.livebids.ng/teasers/iphone15.mp4"
                    pickup_area: "Ikeja, Lagos"
                    seller:
                      id: "8f6b158b-9d41-477d-9dc6-b4d081fdfd8e"
                      name: "Chidi O."
                      rating: 4.85
                    has_reminder: false
                pagination:
                  current_page: 1
                  last_page: 3
                  per_page: 15
                  total: 35

  /feed/live:
    get:
      summary: Live Now active stream carousel
      tags: [Discovery]
      responses:
        200:
          description: List of auctions actively broadcasting live
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LiveAuctionsResponse'
              example:
                status: true
                message: "Live auctions retrieved successfully."
                data:
                  - id: 88
                    title: "MacBook Pro M3 Max 36GB RAM 1TB"
                    status: "live"
                    current_highest_bid_kobo: 185000000
                    live_viewers_count: 142
                    live_started_at: "2026-11-06T18:40:00Z"
                    time_remaining_seconds: 78
                    livekit_room: "auction_room_88"

  /auctions/{id}/remind:
    post:
      summary: Toggle calendar and push reminder for an upcoming auction
      security:
        - BearerAuth: []
      tags: [Discovery]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          example: 101
      responses:
        200:
          description: Reminder state toggled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReminderToggledResponse'
              example:
                status: true
                message: "Reminder set successfully."
                data:
                  auction_id: 101

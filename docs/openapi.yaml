# ==========================================
# COMPONENTS & SCHEMAS
# ==========================================
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Sanctum

  schemas:
    # --- Standard Base Response Envelopes ---
    StandardMessageResponse:
      type: object
      required: [status, message]
      properties:
        status:
          type: boolean
          example: true
        message:
          type: string
          example: "Action performed successfully."

    StandardErrorResponse:
      type: object
      required: [status, message, error, error_code]
      properties:
        status:
          type: boolean
          example: false
        message:
          type: string
          example: "An error occurred."
        error:
          type: string
          example: "ERROR_IDENTIFIER"
        error_code:
          type: string
          example: "ERROR_IDENTIFIER"
        incident_id:
          type: string
          nullable: true
          example: "ERR-LIVE-ABC12345"

    ValidationErrorResponse:
      type: object
      required: [status, message, error, error_code, errors]
      properties:
        status:
          type: boolean
          example: false
        message:
          type: string
          example: "The given data was invalid."
        error:
          type: string
          example: "VALIDATION_ERROR"
        error_code:
          type: string
          example: "VALIDATION_ERROR"
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string

    PaginationMetadata:
      type: object
      required: [current_page, last_page, per_page, total]
      properties:
        current_page:
          type: integer
          example: 1
        last_page:
          type: integer
          example: 5
        per_page:
          type: integer
          example: 15
        total:
          type: integer
          example: 75

    # --- Domain Model Schemas ---
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: "8f6b158b-9d41-477d-9dc6-b4d081fdfd8e"
        identifier:
          type: string
          format: uuid
          example: "8f6b158b-9d41-477d-9dc6-b4d081fdfd8e"
        phone:
          type: string
          example: "+2348012345678"
        name:
          type: string
          example: "Chidi Okonkwo"
        first_name:
          type: string
          example: "Chidi"
        last_name:
          type: string
          example: "Okonkwo"
        email:
          type: string
          format: email
          nullable: true
          example: "chidi.okonkwo@example.com"
        date_of_birth:
          type: string
          format: date
          example: "1998-05-15"
        is_onboarded:
          type: boolean
